# shirase: basemap tiles for Peta Bus. Named for the icebreaker Shirase from
# A Place Further than the Universe (Sora yori mo Tooi Basho).
# See README.md for the data steps; deploying is done by hand, never from here.
name = "shirase"
main = "src/app.ts"
# Dev ports are fixed per app; see docs/dev-ports.md before changing one.
dev.port = 3002
dev.inspector_port = 9232
compatibility_date = "2025-10-18"

# Served on its own hostname (a Workers custom domain: Cloudflare issues its
# certificate and DNS record). Kept here so every deploy keeps it attached.
routes = [{ pattern = "shirase.commute.shiorilabs.id", custom_domain = true }]

# See apps/api/wrangler.toml for the 0.8 rationale. Tile traffic is many small
# requests per map view, so this is the worker most likely to want it lower.
[observability]
enabled = true
head_sampling_rate = 0.8

[vars]
# Comma-separated. Tile, glyph and sprite fetches from MapLibre are CORS
# requests, so the web app's origins are listed: prod and its fixed dev port.
ALLOWED_ORIGINS = "https://commute.shiorilabs.id,http://localhost:5173"

# The PMTiles archives at the bucket root (`<tileset>.pmtiles`), glyphs under
# `fonts/<stack>/<range>.pbf`, sprites under `sprites/<name>`.
[[r2_buckets]]
binding = "TILES"
bucket_name = "shirase"
