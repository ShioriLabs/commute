// Compose compiler stability configuration.
//
// Types listed here are treated as stable by the Compose compiler. Wired into every Compose module
// by the `commute.android.library.compose` / `commute.android.application` convention plugins (see
// build-logic/.../AndroidCompose.kt).
//
// Only add a type here when it is genuinely immutable in this codebase, i.e. no composable is ever
// handed an instance whose contents change without a new instance being created. A wrong entry does
// not fail the build — it makes a composable skip a recomposition it needed, which surfaces as
// stale UI, so the bar for adding a line is "I checked every call site".
//
// Comments use `//`; `#` is not a comment and the parser rejects the file.
//
// To see what the compiler currently considers unstable:
//   ./gradlew assembleRelease -Pcommute.enableComposeCompilerMetrics=true
// then read each module's build/compose-reports/*-composables.txt.
