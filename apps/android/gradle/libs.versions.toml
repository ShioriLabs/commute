[versions]
zstdJni = "1.5.7-21"
sentry = "8.59.0"
# Build tools
agp = "9.3.3"
kotlin = "2.4.10"
ksp = "2.3.6"
# KotlinX
coroutines = "1.11.0"
coroutinesTest = "1.11.0"
serializationJson = "1.11.0"
# AndroidX
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
# Compose
composeBom = "2026.08.00"
phosphor = "1.0.0"
# Arrow
arrow = "2.2.3"
# DataStore
datastore = "1.2.1"
# Room — the disk half of :core:query's response cache
room = "2.8.5"
# Navigation
navigation3 = "1.1.6"
# Hilt
hilt = "2.60.1"
# Blur — backdrop blur for sticky headers
haze = "2.0.0"
# Ktor
ktor = "3.5.2"
# OpenAPI model generator. 26.1.0 is published without a jar, so this stays on the last release
# that can be run.
fabrikt = "26.0.1"
# Wear OS — the watch app, and the Data Layer the phone talks to it over
wearCompose = "1.7.0"
wearOngoing = "1.1.0"
wearRemoteInteractions = "1.2.0"
playServicesWearable = "20.0.1"
# Play services' wearable pulls in Fragment 1.1, too old for the activity result API.
fragment = "1.8.9"
# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
# Baseline Profile — :baselineprofile generates it, ProfileInstaller applies it on first run
benchmark = "1.5.0-rc01"
uiautomator = "2.4.0"
profileinstaller = "1.4.1"

[libraries]
# zstd for the trip log's export, as the Android AAR (native, 16 KB pages).
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
# Crash and ANR reports (Java and native), sent to Sentry.
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
# AndroidX
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Phosphor icons
phosphor-icons = { module = "com.adamglin:phosphor-icon", version.ref = "phosphor" }
# Arrow
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
# DataStore
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Navigation 3
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleRuntimeKtx" }
# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version = "1.4.0" }
# Blur
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
# Haze 2 split the blur effect (`hazeBlur`, `HazeBlurStyle`) out of the core artifact.
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# OpenAPI model generator — run as a build-time tool by :core:model, never shipped.
fabrikt = { module = "com.cjbooms:fabrikt", version.ref = "fabrikt" }
# Wear OS
androidx-wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-wear-compose-ui-tooling = { group = "androidx.wear.compose", name = "compose-ui-tooling", version.ref = "wearCompose" }
androidx-wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wearOngoing" }
androidx-wear-remote-interactions = { group = "androidx.wear", name = "wear-remote-interactions", version.ref = "wearRemoteInteractions" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.7.0" }
# Baseline Profile
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
# Build-logic — Gradle plugin artifacts consumed (compileOnly) by the convention plugins.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
# Convention plugins — resolved from the `build-logic` included build (no version).
commute-android-application = { id = "commute.android.application" }
commute-android-library = { id = "commute.android.library" }
commute-android-library-compose = { id = "commute.android.library.compose" }
commute-android-hilt = { id = "commute.android.hilt" }
commute-kotlin-library = { id = "commute.kotlin.library" }
commute-kotlin-serialization = { id = "commute.kotlin.serialization" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
