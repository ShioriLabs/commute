name = "commute-api"
main = "src/app.ts"
dev.port = 3000
compatibility_date = "2025-10-18"

# 0.8 rather than 1: near-complete visibility into hottest route / hottest
# client / timings (see middleware/request-log.ts) while trimming volume a
# touch under a crawl spike. Dashboard: Workers & Pages > commute-api >
# Observability > Logs.
[observability]
enabled = true
head_sampling_rate = 0.8

[[d1_databases]]
binding = "DB" # available in your Worker on env.DB
database_name = "commute"
database_id = "1d187383-95a3-4e34-aee8-7c99b45aeaa0"
migrations_dir = "src/db/migrations"

[vars]
API_VERSION = "20261009"

[[kv_namespaces]]
binding = "KV"
id = "000e0f51c09844f1b9f85ad26e068129"
preview_id = "6cb9d95fe3324afeb9017776a11a0d4d"

# Abuse backstop, not a quota — see src/middleware/rate-limit.ts for why the
# limits are generous and undocumented. `period` may only be 10 or 60.
# namespace_id is an arbitrary integer unique within the account, not a
# resource that needs creating.
[[ratelimits]]
name = "RATE_LIMIT_DEFAULT"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# Fares run Dijkstra and cache-key on payment method + time bucket, so they are
# both the costliest route and the easiest to miss cache on deliberately.
[[ratelimits]]
name = "RATE_LIMIT_FARE"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Anonymous trip-log uploads (src/routes/uploads.ts). Writes are the one thing
# here that costs storage, so the limit is per IP and ignores the Origin
# exemption.
[[ratelimits]]
name = "RATE_LIMIT_UPLOAD"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Trip-mode GPS traces from the Android app, keyed trips/YYYY/MM/DD/<uuid>.ndjson.zst.
# Create once with: wrangler r2 bucket create commute-trip-logs
[[r2_buckets]]
binding = "TRIP_LOGS"
bucket_name = "commute-trip-logs"
